[flashblade]
# Management address of the FlashBlade.
url = 10.3.11.50
# Whether to verify the management API's TLS certificate. The FlashBlade's
# management certificate is self-signed, so this has to be false.
verify_tls = false

# The two realms under test, both set up with ansible/flashblade-realm.yaml.
# Their API tokens come from the REALM_A_API_TOKEN and REALM_B_API_TOKEN
# environment variables.
#
# spare_ip: an UNUSED address in the realm's subnet. The script uses it to
# try to create network interfaces (see README.md).

[realm_a]
name = isolation-a
spare_ip = 10.8.0.20

[realm_b]
name = isolation-b
spare_ip = 10.8.1.20

[nfs]
# NFS versions to mount with in check 2. Mounting needs sudo on Linux.
# macOS can't mount NFSv4.1, so use "3" there.
mount_versions = 3, 4.1
