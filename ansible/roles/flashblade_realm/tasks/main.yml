---
- name: Create FlashBlade Realm
  everpure.flashblade.purefb_realm:
    name: "{{ realm.name }}"
    without_default_access_list: true
    state: present

- name: Get session token for API
  ansible.builtin.uri:
    url: "https://{{ fb_url }}/api/login"
    method: POST
    headers:
      api-token: "{{ fb_api_token }}"
    validate_certs: "{{ fb_validate_certs | bool }}"
    return_content: false
  register: login_response

# The server needs DNS before it exists, but the realm-scoped DNS needs the
# server's VIP as its source. So a new server is created with the global DNS,
# then moved to the realm-scoped DNS once that exists. A server that already
# exists skips that bootstrap; otherwise every rerun would briefly move a live
# server back to the global DNS.
- name: Look up the existing realm server
  ansible.builtin.uri:
    url: "https://{{ fb_url }}/api/2.22/servers?names={{ realm.name }}::{{ fb_server_name }}"
    method: GET
    headers:
      x-auth-token: "{{ login_response.x_auth_token }}"
    validate_certs: "{{ fb_validate_certs | bool }}"
    status_code: [200, 400]
    return_content: true
  register: server_lookup
  # A missing server is a 400 with "Server does not exist."; any other 400 is
  # a real error, and treating it as "missing" would rerun the bootstrap.
  failed_when: >
    server_lookup.status != 200 and
    'does not exist' not in (server_lookup.content | default(''))

# .get() rather than ['items'], which Jinja resolves to the dict method when
# the key is absent, as it is in the 400 response for a missing server.
- name: Note whether the realm server already exists
  ansible.builtin.set_fact:
    _server_exists: "{{ (((server_lookup.json | default({}, true)).get('items')) or []) | length > 0 }}"

# 400 is accepted for idempotency — the API returns 400 if the resource already exists.
# We use failed_when to verify the 400 contains "already exists" or "already accessible"
# so that real errors are not silently swallowed.
# This pattern applies to all following tasks that accept status 400.
- name: Make global DNS accessible to the realm
  ansible.builtin.uri:
    url: "https://{{ fb_url }}/api/2.22/resource-accesses/batch"
    method: POST
    headers:
      x-auth-token: "{{ login_response.x_auth_token }}"
    body_format: json
    body:
      - resource:
          name: "management"
          resource_type: "dns"
        scope:
          name: "{{ realm.name }}"
          resource_type: "realms"
    validate_certs: "{{ fb_validate_certs | bool }}"
    status_code: [200, 400]
    return_content: true
  register: dns_access_response
  vars:
    response: "{{ dns_access_response.content | default('') }}"
  failed_when: >
    dns_access_response.status != 200 and
    'already accessible' not in response and
    'already exists' not in response
  when: not (_server_exists | bool)

- name: Show DNS access response
  ansible.builtin.debug:
    msg: "Status: {{ dns_access_response.status }} - {{ dns_access_response.content }}"
    verbosity: 1
  when: not (_server_exists | bool)

- name: Create subnet for the realm
  everpure.flashblade.purefb_subnet:
    name: "{{ realm.name }}-subnet"
    prefix: "{{ realm.subnet_prefix }}"
    vlan: "{{ realm.subnet_vlan }}"
    gateway: "{{ realm.subnet_gateway }}"
    mtu: "{{ fb_subnet_mtu }}"
    lag: "{{ fb_subnet_lag }}"
    state: present

- name: Make subnet accessible to the realm
  ansible.builtin.uri:
    url: "https://{{ fb_url }}/api/2.22/resource-accesses/batch"
    method: POST
    headers:
      x-auth-token: "{{ login_response.x_auth_token }}"
    body_format: json
    body:
      - resource:
          name: "{{ realm.name }}-subnet"
          resource_type: "subnets"
        scope:
          name: "{{ realm.name }}"
          resource_type: "realms"
    validate_certs: "{{ fb_validate_certs | bool }}"
    status_code: [200, 400]
    return_content: true
  register: subnet_access_response
  vars:
    response: "{{ subnet_access_response.content | default('') }}"
  failed_when: >
    subnet_access_response.status != 200 and
    'already accessible' not in response and
    'already exists' not in response

- name: Show subnet access response
  ansible.builtin.debug:
    msg: "Status: {{ subnet_access_response.status }} - {{ subnet_access_response.content }}"
    verbosity: 1

- name: Create server (using global DNS)
  everpure.flashblade.purefb_server:
    name: "{{ realm.name }}::{{ fb_server_name }}"
    dns:
      - management
    state: present
  when: not (_server_exists | bool)

- name: Create virtual network interface on server
  ansible.builtin.uri:
    url: "https://{{ fb_url }}/api/2.22/network-interfaces?names={{ realm.name }}::{{ fb_interface_name }}"
    method: POST
    headers:
      x-auth-token: "{{ login_response.x_auth_token }}"
    body_format: json
    body:
      address: "{{ realm.interface_address }}"
      services:
        - data
      type: vip
      attached_servers:
        - name: "{{ realm.name }}::{{ fb_server_name }}"
    validate_certs: "{{ fb_validate_certs | bool }}"
    status_code: [200, 400]
    return_content: true
  register: vip_response
  vars:
    response: "{{ vip_response.content | default('') }}"
  failed_when: >
    vip_response.status != 200 and
    'already exists' not in response

- name: Show VIP creation response
  ansible.builtin.debug:
    msg: "Status: {{ vip_response.status }} - {{ vip_response.content }}"
    verbosity: 1

- name: Create realm-scoped DNS with VIP as source
  everpure.flashblade.purefb_dns:
    name: "{{ realm.name }}::{{ fb_dns_name }}"
    service: data
    domain: "{{ realm.dns_domain }}"
    nameservers: "{{ realm.dns_nameservers }}"
    source: "{{ realm.name }}::{{ fb_interface_name }}"
    state: present

- name: Switch server to realm-scoped DNS
  everpure.flashblade.purefb_server:
    name: "{{ realm.name }}::{{ fb_server_name }}"
    dns:
      - "{{ realm.name }}::{{ fb_dns_name }}"
    state: present

# Look the grant up instead of remembering its ID from the grant task, so that
# a grant left behind by an earlier run that failed partway is also revoked.
- name: Look up resource accesses
  ansible.builtin.uri:
    url: "https://{{ fb_url }}/api/2.22/resource-accesses"
    method: GET
    headers:
      x-auth-token: "{{ login_response.x_auth_token }}"
    validate_certs: "{{ fb_validate_certs | bool }}"
    status_code: [200]
    return_content: true
  register: resource_accesses

- name: Revoke global DNS access from the realm
  ansible.builtin.uri:
    url: "https://{{ fb_url }}/api/2.22/resource-accesses?ids={{ item.id }}"
    method: DELETE
    headers:
      x-auth-token: "{{ login_response.x_auth_token }}"
    validate_certs: "{{ fb_validate_certs | bool }}"
    status_code: [200]
    return_content: true
  loop: >-
    {{ (resource_accesses.json.get('items') or [])
       | selectattr('resource.resource_type', 'equalto', 'dns')
       | selectattr('resource.name', 'equalto', 'management')
       | selectattr('scope.name', 'equalto', realm.name)
       | list }}
  loop_control:
    label: "{{ item.id }}"

- name: Create NFS Export Policy (no TLS) scoped to the realm
  ansible.builtin.uri:
    url: "https://{{ fb_url }}/api/2.22/nfs-export-policies?names={{ realm.name }}::{{ fb_export_policy_name }}"
    method: POST
    headers:
      x-auth-token: "{{ login_response.x_auth_token }}"
    body_format: json
    body:
      rules:
        - access: no-squash
          client: "{{ realm.subnet_prefix }}"
          permission: rw
          required_transport_security: "none"
    validate_certs: "{{ fb_validate_certs | bool }}"
    status_code: [200, 400]
    return_content: true
  register: nfs_policy_response
  vars:
    response: "{{ nfs_policy_response.content | default('') }}"
  failed_when: >
    nfs_policy_response.status != 200 and
    'already exists' not in response

- name: Show NFS export policy response
  ansible.builtin.debug:
    msg: "Status: {{ nfs_policy_response.status }} - {{ nfs_policy_response.content }}"
    verbosity: 1

- name: Create NFS Export Policy (TLS) scoped to the realm
  ansible.builtin.uri:
    url: "https://{{ fb_url }}/api/2.22/nfs-export-policies?names={{ realm.name }}::{{ fb_export_policy_tls_name }}"
    method: POST
    headers:
      x-auth-token: "{{ login_response.x_auth_token }}"
    body_format: json
    body:
      rules:
        - access: no-squash
          client: "{{ realm.subnet_prefix }}"
          permission: rw
          required_transport_security: "tls"
    validate_certs: "{{ fb_validate_certs | bool }}"
    status_code: [200, 400]
    return_content: true
  register: nfs_policy_tls_response
  vars:
    response: "{{ nfs_policy_tls_response.content | default('') }}"
  failed_when: >
    nfs_policy_tls_response.status != 200 and
    'already exists' not in response

- name: Show NFS export policy (TLS) response
  ansible.builtin.debug:
    msg: "Status: {{ nfs_policy_tls_response.status }} - {{ nfs_policy_tls_response.content }}"
    verbosity: 1

- name: Create Object Store account scoped to the realm
  everpure.flashblade.purefb_s3acc:
    name: "{{ realm.name }}::{{ fb_s3_account_name }}"
    state: present

- name: Export Object Store account via server
  everpure.flashblade.purefb_s3acc_export:
    account: "{{ realm.name }}::{{ fb_s3_account_name }}"
    server: "{{ realm.name }}::{{ fb_server_name }}"
    policy: "{{ fb_s3_export_policy_name }}"
    state: present

- name: Create Management Access Policy scoped to the realm
  ansible.builtin.uri:
    url: "https://{{ fb_url }}/api/2.22/management-access-policies?names={{ realm.name }}-{{ fb_admin_policy_name }}"
    method: POST
    headers:
      x-auth-token: "{{ login_response.x_auth_token }}"
    body_format: json
    body:
      aggregation_strategy: least-common-permission
      rules:
        - role:
            name: storage
          scope:
            name: "{{ realm.name }}"
            resource_type: realms
    validate_certs: "{{ fb_validate_certs | bool }}"
    status_code: [200, 400]
    return_content: true
  register: mgmt_policy_response
  vars:
    response: "{{ mgmt_policy_response.content | default('') }}"
  failed_when: >
    mgmt_policy_response.status != 200 and
    'already exists' not in response

- name: Show management access policy response
  ansible.builtin.debug:
    msg: "Status: {{ mgmt_policy_response.status }} - {{ mgmt_policy_response.content }}"
    verbosity: 1

- name: Create Service Account attached to the realm policy
  ansible.builtin.uri:
    url: "https://{{ fb_url }}/api/2.26/admins?names={{ realm.name }}-{{ fb_admin_user }}"
    method: POST
    headers:
      x-auth-token: "{{ login_response.x_auth_token }}"
    body_format: json
    body:
      admin_type: service-account
      management_access_policies:
        - name: "{{ realm.name }}-{{ fb_admin_policy_name }}"
    validate_certs: "{{ fb_validate_certs | bool }}"
    status_code: [200, 400]
    return_content: true
  register: admin_user_response
  vars:
    response: "{{ admin_user_response.content | default('') }}"
  failed_when: >
    admin_user_response.status != 200 and
    'already exists' not in response

- name: Show service account creation response
  ansible.builtin.debug:
    msg: "Status: {{ admin_user_response.status }} - {{ admin_user_response.content }}"
    verbosity: 1

# Clients reach the realm by the data VIP, so that IP must be in the
# Subject Alternative Names or the certificate fails verification. Extra
# names (for example a DNS record pointing at the VIP) can be added per
# realm with cert_subject_alternative_names.
- name: Build the desired certificate subject alternative names
  ansible.builtin.set_fact:
    _cert_sans: "{{ ([realm.interface_address] + (realm.cert_subject_alternative_names | default([]))) | unique | sort }}"

# purefb_certs always reports "changed" and always generates a new private key
# for a certificate that already exists, so calling it unconditionally rotates
# every realm's key on every run. Only call it when the realm has no
# certificate yet, or when a rotation is asked for explicitly.
- name: Look up the existing realm certificate
  ansible.builtin.uri:
    url: "https://{{ fb_url }}/api/2.22/certificates?names={{ realm.name }}::{{ fb_cert_name }}"
    method: GET
    headers:
      x-auth-token: "{{ login_response.x_auth_token }}"
    validate_certs: "{{ fb_validate_certs | bool }}"
    status_code: [200, 400]
    return_content: true
  register: cert_lookup

# .get() rather than ['items'], which Jinja resolves to the dict method when
# the key is absent, as it is in the 400 response for a missing certificate.
- name: Note whether the realm certificate already exists
  ansible.builtin.set_fact:
    _cert_exists: "{{ (((cert_lookup.json | default({}, true)).get('items')) or []) | length > 0 }}"

- name: Show certificate generation decision
  ansible.builtin.debug:
    msg: >-
      {{ realm.name }}::{{ fb_cert_name }} -
      exists {{ _cert_exists }},
      generate {{ (not (_cert_exists | bool)) or (fb_force_cert_regenerate | bool) }}

- name: Generate Self-Signed Certificate scoped to realm
  everpure.flashblade.purefb_certs:
    name: "{{ realm.name }}::{{ fb_cert_name }}"
    common_name: "{{ realm.interface_address }}"
    subject_alternative_names: "{{ _cert_sans }}"
    generate: true
    state: present
  when: (not (_cert_exists | bool)) or (fb_force_cert_regenerate | bool)

- name: Create TLS Policy scoped to the realm
  everpure.flashblade.purefb_tls_policy:
    name: "{{ realm.name }}::{{ fb_tls_policy_name }}"
    appliance_certificate: "{{ realm.name }}::{{ fb_cert_name }}"
    state: present

- name: Bind Interface to TLS Policy
  everpure.flashblade.purefb_tls_policy:
    name: "{{ realm.name }}::{{ fb_tls_policy_name }}"
    network_interfaces:
      - "{{ realm.name }}::{{ fb_interface_name }}"
    state: present

- name: Generate API Token for Service Account
  ansible.builtin.uri:
    url: "https://{{ fb_url }}/api/2.26/admins/api-tokens?admin_names={{ realm.name }}-{{ fb_admin_user }}"
    method: POST
    headers:
      x-auth-token: "{{ login_response.x_auth_token }}"
    body_format: json
    body:
      timeout: 0
    validate_certs: "{{ fb_validate_certs | bool }}"
    status_code: [200, 400]
    return_content: true
  register: generated_token
  no_log: true
  vars:
    response: "{{ generated_token.content | default('') }}"
  failed_when: >
    generated_token.status != 200 and
    'already exists' not in response and
    'already created' not in response

# The FlashBlade API only returns the API token at creation time. If the
# token already existed it cannot be retrieved, so the secrets are left alone
# rather than written with an empty token.
- name: Report that the existing credentials were left alone
  ansible.builtin.debug:
    msg: >-
      {{ realm.name }}-{{ fb_admin_user }} already has an API token, which the
      FlashBlade cannot return again. The cluster/{{ realm.name }}/portworx and
      cluster/{{ realm.name }}/pure-cosi secrets were not changed. To issue a new
      token, the existing one has to be deleted first.
  when: generated_token.status != 200

# The token is read from this realm's own registered result inside each task,
# rather than saved with set_fact, because a fact would carry over to the next
# realm in the loop.
#
# overwrite is true because these tasks only run when a new token was just
# created, which means any token already stored in the secret no longer works.
- name: Upload portworx credentials to AWS Secrets Manager
  community.aws.secretsmanager_secret:
    name: "cluster/{{ realm.name }}/portworx"
    secret_type: string
    secret: "{{ {'FlashBlades': [entry]} | to_json }}"
    region: "{{ aws_region }}"
    profile: "{{ aws_profile }}"
    overwrite: true
    state: present
  vars:
    entry:
      MgmtEndPoint: "{{ fb_url }}"
      APIToken: "{{ generated_token.json['items'][0].api_token.token }}"
      Realm: "{{ realm.name }}"
      NFSEndPoint: "{{ realm.interface_address }}"
  when: generated_token.status == 200
  no_log: true

- name: Upload pure-cosi credentials to AWS Secrets Manager
  community.aws.secretsmanager_secret:
    name: "cluster/{{ realm.name }}/pure-cosi"
    secret_type: string
    secret: "{{ cosi_entry | to_json }}"
    region: "{{ aws_region }}"
    profile: "{{ aws_profile }}"
    overwrite: true
    state: present
  vars:
    cosi_entry:
      PUREFB_TARGET: "{{ fb_url }}"
      PUREFB_API_TOKEN: "{{ generated_token.json['items'][0].api_token.token }}"
      PUREFB_REALM: "{{ realm.name }}"
      S3_ENDPOINT: "{{ realm.s3_endpoint }}"
      PUREFB_S3_ACCOUNT: "{{ fb_s3_account_name }}"
  when: generated_token.status == 200
  no_log: true
