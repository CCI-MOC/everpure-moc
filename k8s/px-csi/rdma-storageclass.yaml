allowVolumeExpansion: true
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pure-fb-rdma
mountOptions:
- vers=3
- rdma
parameters:
  backend: pure_file
  pure_nfs_policy: 'export-policy' # name of the policy in the realm.
  pure_nfs_server: "nfs-server" # must specify this to match the name of server in realm
  pure_fb_hard_limit_enabled:  "true"
provisioner: pxd.portworx.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
